name: Native Intent Browser
on:
  pull_request:
    paths:
      - 'runtime/cloudflare-os-kotodama/**'
      - 'tools/test_native_intent_browser.py'
      - '.github/workflows/native-intent-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned browser test harness
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise shipped client with isolated synthetic RPC
        shell: bash
        run: |
          mkdir -p browser-evidence
          python tools/test_native_intent_browser.py --evidence-dir browser-evidence > browser-evidence/results.json
      - name: Preserve component evidence without claiming full OS E2E
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-intent-browser-${{ github.run_id }}
          path: browser-evidence/
          if-no-files-found: error
          retention-days: 7
