name: Task swarm validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: validate (${{ matrix.os }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # Hosted ubuntu-latest refused bwrap uid maps. Test on the explicit
        # 22.04 image without changing either host's security policy.
        include:
          - {os: ubuntu-22.04, shard: 0, shards: 1}
          - {os: windows-latest, shard: 0, shards: 4}
          - {os: windows-latest, shard: 1, shards: 4}
          - {os: windows-latest, shard: 2, shards: 4}
          - {os: windows-latest, shard: 3, shards: 4}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      KOTODAMA_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KOTODAMA_CI_SHARD_OS: ${{ matrix.os }}
      KOTODAMA_CI_SHARD_INDEX: ${{ matrix.shard }}
      KOTODAMA_CI_SHARD_COUNT: ${{ matrix.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Run tracked credential gate before dependency installation
        run: python -S -B tools/check_tracked_secret_hygiene.py
      - name: Install the hash-locked task swarm dependency set
        run: python -m pip install --require-hashes -r requirements-task-swarm-ci.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Linux'
        with:
          node-version: '24'
      - name: Install pinned CLI for synthetic permission probes only
        if: runner.os == 'Linux'
        run: |
          npm install --global pnpm@11.19.0
          pnpm --dir tests/fixtures/codex-sandbox install --frozen-lockfile --ignore-scripts
          binary="$(find tests/fixtures/codex-sandbox/node_modules/.pnpm -path '*/vendor/x86_64-unknown-linux-musl/bin/codex' -type f)"
          test -n "$binary" && test "$(printf '%s\n' "$binary" | wc -l)" -eq 1
          printf 'KOTODAMA_TEST_CODEX_SANDBOX=%s/%s\n' "$GITHUB_WORKSPACE" "$binary" >> "$GITHUB_ENV"
      - name: Independently collect the complete Task swarm reference
        if: ${{ matrix.shard == 0 }}
        run: python -B tools/pytest_ci_shards.py reference "${{ runner.temp }}/task-swarm-shard/reference"
      - name: Run the complete collection's assigned Task swarm occurrences
        env:
          PYTEST_PLUGINS: tools.pytest_ci_observer,tools.pytest_ci_shards,tools.pytest_ci_process_probe
          KOTODAMA_CI_OBSERVATION_DIR: ${{ runner.temp }}/task-swarm-shard/observation
          KOTODAMA_CI_SHARD_DIR: ${{ runner.temp }}/task-swarm-shard/partition
          KOTODAMA_CI_PROCESS_PROBE_DIR: ${{ runner.temp }}/task-swarm-process-probe
          KOTODAMA_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m pytest -q -p no:cacheprovider -o 'python_files=test_task_swarm_*.py' tests
      - name: Require complete pytest observation after success
        run: python -B tools/pytest_ci_observer.py "${{ runner.temp }}/task-swarm-shard/observation"
      - run: python tools/task_swarm.py demo --root work/ci-offline-demo --allow-local-fixture
        id: demo
        if: ${{ matrix.shard == 0 }}
      - name: Benchmark long context, corrections, restart and retained history
        id: benchmark
        if: ${{ matrix.shard == 0 }}
        run: python -B tools/task_swarm_benchmark.py --allow-local-fixture --output work/ci-swarm-benchmark.json --github-summary
      - name: Bind successful execution and required post-checks
        run: python -B tools/pytest_ci_shards.py seal "${{ runner.temp }}/task-swarm-shard" --demo '${{ steps.demo.outcome }}' --benchmark '${{ steps.benchmark.outcome }}'
      - name: Preserve complete or partial pytest observations
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-swarm-shard-${{ matrix.os }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task-swarm-shard
          if-no-files-found: error
          retention-days: 7
      - name: Preserve bounded child-timeout diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-swarm-process-${{ matrix.os }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task-swarm-process-probe
          if-no-files-found: ignore
          retention-days: 7
  complete:
    name: Complete Task swarm coverage
    needs: [validate]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      MATRIX_RESULT: ${{ needs.validate.result }}
      KOTODAMA_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require every current shard job
        run: test "$MATRIX_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Run tracked credential gate before dependency installation
        run: python -S -B tools/check_tracked_secret_hygiene.py
      - run: python -m pip install --require-hashes -r requirements-task-swarm-ci.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: task-swarm-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task-swarm-matrix
      - name: Require the independent full inventory and exact occurrence union
        run: python -B tools/pytest_ci_shards.py verify "${{ runner.temp }}/task-swarm-matrix"
