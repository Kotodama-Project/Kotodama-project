name: Task swarm validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        # Hosted ubuntu-latest refused bwrap uid maps. Test on the explicit
        # 22.04 image without changing either host's security policy.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Run tracked credential gate before dependency installation
        run: python -S -B tools/check_tracked_secret_hygiene.py
      - name: Install the hash-locked task swarm dependency set
        run: python -m pip install --require-hashes -r requirements-task-swarm-ci.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.os == 'Linux'
        with:
          node-version: '24'
      - name: Install pinned CLI for synthetic permission probes only
        if: runner.os == 'Linux'
        run: |
          npm install --global pnpm@11.19.0
          pnpm --dir tests/fixtures/codex-sandbox install --frozen-lockfile --ignore-scripts
          binary="$(find tests/fixtures/codex-sandbox/node_modules/.pnpm -path '*/vendor/x86_64-unknown-linux-musl/bin/codex' -type f)"
          test -n "$binary" && test "$(printf '%s\n' "$binary" | wc -l)" -eq 1
          printf 'KOTODAMA_TEST_CODEX_SANDBOX=%s/%s\n' "$GITHUB_WORKSPACE" "$binary" >> "$GITHUB_ENV"
      - name: Run the complete Task swarm tests with bounded observations
        env:
          PYTEST_PLUGINS: tools.pytest_ci_observer
          KOTODAMA_CI_OBSERVATION_DIR: ${{ runner.temp }}/task-swarm-observation
          KOTODAMA_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m pytest -q -p no:cacheprovider -o 'python_files=test_task_swarm_*.py' tests
      - name: Require complete pytest observation after success
        run: python -B tools/pytest_ci_observer.py "${{ runner.temp }}/task-swarm-observation"
      - run: python tools/task_swarm.py demo --root work/ci-offline-demo --allow-local-fixture
      - name: Benchmark long context, corrections, restart and retained history
        run: python -B tools/task_swarm_benchmark.py --allow-local-fixture --output work/ci-swarm-benchmark.json --github-summary
      - name: Preserve complete or partial pytest observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-swarm-observation-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task-swarm-observation
          if-no-files-found: error
          retention-days: 7
