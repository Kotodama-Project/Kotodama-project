name: Python package candidate
on:
  pull_request:
    paths:
      - pyproject.toml
      - MANIFEST.in
      - LICENSE
      - python/**
      - runtime/task_swarm/**
      - requirements-package*.txt
      - requirements-ci.txt
      - requirements-task-swarm-ci.txt
      - tools/build_release_sbom.py
      - tools/build_python_candidate.py
      - tools/record_python_candidate_execution.py
      - tests/test_python*py
      - .github/workflows/python-package-candidate.yml
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build Python candidate (${{ matrix.os }})
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - run: python -S -B tools/check_tracked_secret_hygiene.py
      - run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-package-ci.txt
      - run: python -B -m unittest tests.test_python_package_contract tests.test_python_candidate_artifacts -v
      - name: Build the same commit twice with normalized metadata
        run: |
          python -B tools/build_python_candidate.py --output work/package-first
          python -B tools/build_python_candidate.py --output work/package-second
      - name: Compare and install each artifact in a new environment
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          first = json.loads((root/'work/package-first/build-receipt.json').read_text())
          second = json.loads((root/'work/package-second/build-receipt.json').read_text())
          assert first == second
          for index, name in enumerate(first['artifacts']):
              if not name.endswith(('.whl', '.tar.gz')):
                  continue
              environment = root / f'work/installed-{index}'
              subprocess.run([sys.executable, '-m', 'venv', str(environment)], check=True)
              binary = environment / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              subprocess.run([str(binary), '-m', 'pip', 'install', '--require-hashes', '-r', str(root/'requirements-package-ci.txt')], check=True)
              subprocess.run([str(binary), '-m', 'pip', 'install', '--no-index', '--no-deps', '--no-build-isolation', str(root/'work/package-first'/name)], check=True)
              subprocess.run([str(binary), '-I', str(root/'python/package_probe.py')], cwd=environment, check=True)
      - id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-candidate-${{ matrix.os }}
          retention-days: 7
          path: |
            work/package-first/*.whl
            work/package-first/*.tar.gz
            work/package-first/*.json
            work/package-first/SHA256SUMS
      - name: Bind run, job, workflow, and artifact metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_JOB_NAME: Build Python candidate (${{ matrix.os }})
          CANDIDATE_ARTIFACT_NAME: python-candidate-${{ matrix.os }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        run: python -B tools/record_python_candidate_execution.py --build-receipt work/package-first/build-receipt.json --output work/execution-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-execution-${{ matrix.os }}
          path: work/execution-receipt.json
          retention-days: 7
  compare:
    name: Compare Python artifacts across operating systems
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-candidate-*
          path: candidates
      - name: Require identical bytes and receipts
        shell: python
        run: |
          import hashlib, json, pathlib
          root = pathlib.Path('candidates')
          linux = root / 'python-candidate-ubuntu-24.04'
          windows = root / 'python-candidate-windows-latest'
          first = json.loads((linux/'build-receipt.json').read_text())
          second = json.loads((windows/'build-receipt.json').read_text())
          assert first == second
          for name, entry in first['artifacts'].items():
              for directory in (linux, windows):
                  raw = (directory/name).read_bytes()
                  assert len(raw) == entry['bytes']
                  assert hashlib.sha256(raw).hexdigest() == entry['sha256']
          print('Identical Linux/Windows artifact bytes and builder receipts')
