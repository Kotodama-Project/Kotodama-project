name: Python package candidate
on:
  pull_request:
    paths:
      - pyproject.toml
      - MANIFEST.in
      - python/**
      - runtime/task_swarm/**
      - requirements-package*.txt
      - tools/build_python_candidate.py
      - tests/test_python*py
      - .github/workflows/python-package-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - run: python -S -B tools/check_tracked_secret_hygiene.py
      - run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-package-ci.txt
      - run: python -B -m unittest tests.test_python_package_contract tests.test_python_candidate_artifacts -v
      - name: Build the same commit twice with normalized metadata
        run: |
          python -B tools/build_python_candidate.py --output work/package-first
          python -B tools/build_python_candidate.py --output work/package-second
      - name: Compare and install each artifact in a new environment
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          first = json.loads((root/'work/package-first/build-receipt.json').read_text())
          second = json.loads((root/'work/package-second/build-receipt.json').read_text())
          assert first == second
          for index, name in enumerate(first['artifacts']):
              if not name.endswith(('.whl', '.tar.gz')):
                  continue
              environment = root / f'work/installed-{index}'
              subprocess.run([sys.executable, '-m', 'venv', str(environment)], check=True)
              binary = environment / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              subprocess.run([str(binary), '-m', 'pip', 'install', '--require-hashes', '-r', str(root/'requirements-package-ci.txt')], check=True)
              subprocess.run([str(binary), '-m', 'pip', 'install', '--no-index', '--no-deps', '--no-build-isolation', str(root/'work/package-first'/name)], check=True)
              subprocess.run([str(binary), '-I', str(root/'python/package_probe.py')], cwd=environment, check=True)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-candidate-${{ matrix.os }}
          retention-days: 7
          path: |
            work/package-first/*.whl
            work/package-first/*.tar.gz
            work/package-first/*.json
            work/package-first/SHA256SUMS
