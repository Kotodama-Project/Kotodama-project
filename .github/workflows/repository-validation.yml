name: Repository validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Trusted repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          check-latest: false
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Run the README review-chain smoke
        run: python -B tools/smoke_company_pack_review_chain.py
      - name: Run the README runtime candidate checks
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/validate_installation_lifecycle.py examples/installation-lifecycle/compose-minimum.json
          python -B tools/validate_installation_lifecycle.py examples/installation-lifecycle/proxmox-segmented.json
          python -B tools/validate_compose_minimum_skeleton.py runtime/compose-minimum
      - name: Run the complete public test suite
        run: python -m unittest discover -s tests -v
      - name: Refuse whitespace errors and generated changes
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
