name: Repository validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keep these names stable for existing branch protection.
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test repository guards
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate the tracked repository
        run: python -B tools/validate_repository.py
      - name: Check whitespace
        run: git diff --check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Scan tracked files with pinned Gitleaks
        run: python -B tools/check_secrets.py

  validate:
    name: Trusted repository validation
    needs: [test, secrets]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SECRET_RESULT: ${{ needs.secrets.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$SECRET_RESULT" = success
