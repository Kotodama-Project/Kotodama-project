name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Trusted repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up exact Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          check-latest: false

      - name: Run the README one-command smoke
        run: python -S -B tools/smoke_company_pack_review_chain.py

      - name: Run the README runtime candidate checks
        shell: bash
        run: |
          set -euo pipefail
          python -S -B tools/validate_installation_lifecycle.py examples/installation-lifecycle/compose-minimum.json
          python -S -B tools/validate_installation_lifecycle.py examples/installation-lifecycle/proxmox-segmented.json
          python -S -B tools/validate_compose_minimum_skeleton.py runtime/compose-minimum

      - name: Validate workflow syntax and immutable action references
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          install_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "$install_dir"
          curl -fsSLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$install_dir" actionlint
          chmod +x "$install_dir/actionlint"
          "$install_dir/actionlint" -version
          "$install_dir/actionlint" .github/workflows/*.yml
          python - <<'PY'
          from pathlib import Path
          import re

          uses_pattern = re.compile(r"^\s*(?:-\s*)?uses:\s*([^\s#]+)")
          immutable_pattern = re.compile(r"^[^@\s]+@[0-9a-fA-F]{40}$")
          violations = []

          for path in sorted(Path(".github/workflows").glob("*.y*ml")):
              for line_number, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(), start=1
              ):
                  match = uses_pattern.match(line)
                  if not match:
                      continue
                  reference = match.group(1).strip("'\"")
                  if reference.startswith(("./", "docker://")):
                      continue
                  if not immutable_pattern.fullmatch(reference):
                      violations.append(f"{path}:{line_number}: {reference}")

          if violations:
              raise SystemExit(
                  "External GitHub Actions must be pinned to a full "
                  "40-character commit SHA:\n" + "\n".join(violations)
              )

          print("All external GitHub Actions are pinned to immutable commit SHAs.")
          PY

      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Run the public test suite
        run: python -m unittest discover -s tests -v

      - name: Refuse generated changes
        shell: bash
        run: test -z "$(git status --porcelain)"
