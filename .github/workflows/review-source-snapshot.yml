name: Swarm review source evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'fix/swarm-acceptance-storage-20260914'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 86bc5bf45124e1b8e4520d376028c4e2eba99c84
          persist-credentials: false
          path: review-tools
          sparse-checkout: tools/check_tracked_secret_hygiene.py
          sparse-checkout-cone-mode: false
      - name: Select exact tracked Swarm code and regression inputs
        shell: python
        run: |
          import os, pathlib, subprocess
          root = pathlib.Path('candidate')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'swarm-input'
          target.mkdir()
          entries = subprocess.check_output(['git','ls-files','-z'], cwd=root).decode().split('\0')
          selected = [p for p in entries if p and ('swarm' in p.lower() or p in {'requirements-test.txt','requirements-ci.txt','runtime/__init__.py','tests/__init__.py'})]
          for name in selected:
              source = root / name
              if source.is_symlink() or not source.is_file():
                  raise RuntimeError('Review inputs must be regular tracked files')
              output = target / name
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(subprocess.check_output(['git','show','HEAD:'+name], cwd=root))
          subprocess.run(['git','init'], cwd=target, check=True)
          subprocess.run(['git','add','.'], cwd=target, check=True)
          subprocess.run(['git','-c','user.name=Review fixture','-c','user.email=review@example.invalid','commit','-m','Exact tracked review inputs'], cwd=target, check=True)
      - name: Refuse credentials in every exported input
        run: python -S -B review-tools/tools/check_tracked_secret_hygiene.py --root "${RUNNER_TEMP}/swarm-input"
      - name: Package only the fully scanned input tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/swarm-source"
          git -C candidate rev-parse HEAD > "${RUNNER_TEMP}/swarm-source/COMMIT.txt"
          git -C "${RUNNER_TEMP}/swarm-input" archive --format=tar HEAD > "${RUNNER_TEMP}/swarm-source/source.tar"
          git -C "${RUNNER_TEMP}/swarm-input" ls-tree -r HEAD > "${RUNNER_TEMP}/swarm-source/BLOBS.txt"
          cd "${RUNNER_TEMP}/swarm-source"
          sha256sum source.tar > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swarm-review-source-${{ github.sha }}
          path: ${{ runner.temp }}/swarm-source/
          retention-days: 3
          if-no-files-found: error
