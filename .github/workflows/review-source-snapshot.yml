name: Review source evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'fix/review-runtime-boundaries-20260914'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Refuse tracked credentials
        run: python -S -B tools/check_tracked_secret_hygiene.py
      - name: Package tracked candidate source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/review-source"
          git rev-parse HEAD > "${RUNNER_TEMP}/review-source/COMMIT.txt"
          git archive --format=tar HEAD > "${RUNNER_TEMP}/review-source/source.tar"
          cd "${RUNNER_TEMP}/review-source"
          sha256sum source.tar > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-source-${{ github.sha }}
          path: ${{ runner.temp }}/review-source/
          retention-days: 3
          if-no-files-found: error
