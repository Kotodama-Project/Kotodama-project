name: Review source evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'fix/review-runtime-boundaries-20260914'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Refuse tracked credentials
        run: python -S -B tools/check_tracked_secret_hygiene.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install locked review dependencies without lifecycle scripts
        working-directory: runtime/discord-template
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Package tracked source and credential-free test toolchain
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/review-source"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/COMMIT.txt"
          git archive --format=tar HEAD > "$evidence/source.tar"
          cp "$(command -v node)" "$evidence/node"
          node --version > "$evidence/NODE_VERSION.txt"
          tar -C runtime/discord-template -czf "$evidence/node_modules.tar.gz" node_modules
          cd "$evidence"
          sha256sum source.tar node node_modules.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-source-${{ github.sha }}
          path: ${{ runner.temp }}/review-source/
          retention-days: 3
          if-no-files-found: error
