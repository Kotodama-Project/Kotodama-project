# TEMPORARY diagnostic for #167. Removed before merge.
name: Diagnose browser test timing (#167)
on:
  pull_request:
    paths:
      - .github/workflows/diag-browser-167.yml
      - runtime/discord-template/tests/diag-browser-167.mjs
      - runtime/discord-template/tests/browser.test.mjs
permissions:
  contents: read
jobs:
  factor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # setup-only:  heavy job setup (ffmpeg, docker pull), then the browser test alone
        # tests-only:  no heavy setup, the 10 preceding test files, then the browser test
        # suite:       heavy setup, then the full suite (the real CI condition, cold Chrome)
        mode: [setup-only, tests-only, suite]
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DEBUG: pw:browser
    defaults:
      run:
        working-directory: runtime/discord-template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Start I/O sampler (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          nohup bash -c 'while true; do echo "IO $(date -u +%H:%M:%S) $(vmstat 1 2 | tail -1) psi=$(head -1 /proc/pressure/io 2>/dev/null)"; done' > "$RUNNER_TEMP/io.txt" 2>&1 &
      - name: Install audio encoder (Linux)
        if: runner.os == 'Linux' && matrix.mode != 'tests-only'
        working-directory: .
        run: |
          echo "MARK $(date -u +%H:%M:%S) apt-start"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg > /dev/null
          echo "MARK $(date -u +%H:%M:%S) apt-end"
      - name: Install audio encoder (Windows)
        if: runner.os == 'Windows' && matrix.mode != 'tests-only'
        shell: pwsh
        working-directory: .
        run: |
          "MARK $((Get-Date).ToUniversalTime().ToString('HH:mm:ss')) choco-start"
          choco install ffmpeg --yes --no-progress | Out-Null
          "MARK $((Get-Date).ToUniversalTime().ToString('HH:mm:ss')) choco-end"
      - name: Prepare isolated Linux verification fixture
        if: runner.os == 'Linux' && matrix.mode != 'tests-only'
        shell: bash
        run: |
          set -euo pipefail
          echo "MARK $(date -u +%H:%M:%S) docker-start"
          fixture='node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6'
          docker pull -q "$fixture"
          image="$(docker image inspect --format '{{.Id}}' "$fixture")"
          printf 'KOTODAMA_TEST_VERIFIER_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
          echo "MARK $(date -u +%H:%M:%S) docker-end"
      - name: The measured run
        shell: bash
        run: |
          echo "MARK $(date -u +%H:%M:%S) measured-start mode=${{ matrix.mode }}"
          case "${{ matrix.mode }}" in
            setup-only) files="tests/browser.test.mjs" ;;
            tests-only) files="tests/access-monitor.test.mjs tests/agent-channel.test.mjs tests/analysis-admission.test.mjs tests/analysis-policy.test.mjs tests/archive-adapter.test.mjs tests/archive-context.test.mjs tests/archive-host.test.mjs tests/archive-runtime.test.mjs tests/artifact-read.test.mjs tests/bridge.test.mjs tests/browser.test.mjs" ;;
            suite) files="tests/*.test.mjs" ;;
          esac
          node --test --test-concurrency=1 --test-timeout=120000 $files > "$RUNNER_TEMP/measured.txt" 2>&1 || true
          echo "MARK $(date -u +%H:%M:%S) measured-end"
          grep -E 'DIAG167|real browser|pw:browser|ℹ (tests|pass|fail)|Timeout|timed out' "$RUNNER_TEMP/measured.txt" | cut -c1-300 | head -120
          echo "MARK $(date -u +%H:%M:%S) second-start"
          node --test --test-concurrency=1 --test-timeout=120000 tests/browser.test.mjs 2>&1 | grep -E 'DIAG167|real browser' || true
      - name: I/O samples
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/io.txt" || true
