# TEMPORARY diagnostic for #167. Removed before merge.
name: Diagnose browser test timing (#167)
on:
  pull_request:
    paths:
      - .github/workflows/diag-browser-167.yml
      - runtime/discord-template/tests/diag-browser-167.mjs
      - runtime/discord-template/tests/browser.test.mjs
permissions:
  contents: read
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtime/discord-template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install audio encoder (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install audio encoder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --yes --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (20 * $attempt) }
          }
      - name: Prepare isolated Linux verification fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          fixture='node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6'
          docker pull "$fixture"
          image="$(docker image inspect --format '{{.Id}}' "$fixture")"
          printf 'KOTODAMA_TEST_VERIFIER_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Full suite with a CPU sampler (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ( while true; do echo "SAMPLE $(date -u +%H:%M:%S) load=$(cut -d' ' -f1 /proc/loadavg)"; ps -eo pcpu,etimes,comm --sort=-pcpu | sed -n '2,6p' | sed 's/^/  /'; sleep 1; done ) > "$RUNNER_TEMP/sampler.txt" 2>&1 &
          sampler=$!
          pnpm test 2>&1 | grep -E 'DIAG167|real browser|ℹ (tests|pass|fail|duration)|Timeout|timed out' || true
          kill $sampler || true
          cat "$RUNNER_TEMP/sampler.txt" | head -400
      - name: Full suite with a CPU sampler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sampler = Start-Job -ScriptBlock {
            $prev = @{}
            while ($true) {
              $now = Get-Process | Select-Object Id, ProcessName, CPU
              $rows = foreach ($p in $now) { $d = if ($prev.ContainsKey($p.Id)) { $p.CPU - $prev[$p.Id] } else { 0 }; [pscustomobject]@{ Name = $p.ProcessName; Delta = [math]::Round($d, 2) } }
              $prev = @{}; foreach ($p in $now) { $prev[$p.Id] = $p.CPU }
              $total = (Get-CimInstance Win32_Processor | Measure-Object -Property LoadPercentage -Average).Average
              "SAMPLE $((Get-Date).ToUniversalTime().ToString('HH:mm:ss')) cpu=$total%"
              $rows | Sort-Object Delta -Descending | Select-Object -First 5 | ForEach-Object { "  $($_.Delta)s $($_.Name)" }
              Start-Sleep -Seconds 1
            }
          }
          pnpm test 2>&1 | Select-String -Pattern 'DIAG167|real browser|ℹ (tests|pass|fail|duration)|Timeout|timed out'
          Stop-Job $sampler
          Receive-Job $sampler | Select-Object -First 600
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AMRunningMode | Format-List
