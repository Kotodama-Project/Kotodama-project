name: Business Rehearsal

on:
  pull_request:
    paths:
      - 'runtime/git-steward/**'
      - 'tests/test_git_steward_runtime.py'
      - 'tests/test_company_pack_review_response.py'
      - 'tests/test_company_pack_review_decision_handoff.py'
      - 'tests/test_cloudflare_os_integration.py'
      - 'docs/BUSINESS-REHEARSAL.md'
      - '.github/workflows/business-rehearsal.yml'
      - 'tools/*knowledge*.py'
      - 'tools/validate_resolved_compose_candidate.py'
      - 'tests/test_knowledge_work_validation.py'
      - 'tests/test_strict_json_depth.py'
      - 'schemas/knowledge-*.schema.json'
      - 'examples/knowledge-work/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check coordination and business regressions
        run: python -B -m unittest discover -s tests -p test_git_steward_runtime.py -v
      - name: Record synthetic local business rehearsal
        run: node runtime/git-steward/business-rehearsal.mjs > business-rehearsal.json
      - name: Record existing Company Pack review chain
        run: python -B tools/smoke_company_pack_review_chain.py > company-review-chain.json
      - name: Check Company Pack response fixtures
        run: python -B -m unittest discover -s tests -p test_company_pack_review_response.py -v
      - name: Check Company Pack handoff fixtures
        run: python -B -m unittest discover -s tests -p test_company_pack_review_decision_handoff.py -v
      - name: Check OS integration input boundaries
        run: python -B -m unittest discover -s tests -p test_cloudflare_os_integration.py -v
      - name: Check portable strict JSON depth
        run: python -B -m unittest discover -s tests -p test_strict_json_depth.py -v
      - name: Check knowledge evidence and context boundaries
        run: python -B -m unittest discover -s tests -p test_knowledge_work_validation.py -v
      - name: Record knowledge work audit
        run: python -B tools/audit_knowledge_workspaces.py --format json --fail-on error --require-package > knowledge-work-audit.json
      - name: Record bounded knowledge context
        run: python -B tools/compile_knowledge_context.py examples/knowledge-work/business-rehearsal > knowledge-context.json
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: business-rehearsal-${{ matrix.os }}
          path: |
            business-rehearsal.json
            company-review-chain.json
            knowledge-work-audit.json
            knowledge-context.json
          if-no-files-found: error
          retention-days: 7
