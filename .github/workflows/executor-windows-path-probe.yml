name: Windows executor path diagnostic
on:
  push:
    branches:
      - 'diagnostic/executor-windows-path-20261013'
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Observe bounded CreateProcess cwd lengths
        run: python -I -B experiments/executor_windows_path_probe.py
