name: Control Plane Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-08
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-09-08
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
      - name: Run Knowledge Work CI
        run: python tools/audit_knowledge_workspaces.py --format markdown --fail-on error --require-package
      - name: Emit control-plane audit
        run: python tools/audit_control_plane.py --format markdown --fail-on error
      - name: Emit proposal-only maintenance plan
        run: python tools/plan_control_plane_maintenance.py --format markdown
