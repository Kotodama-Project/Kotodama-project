name: Control Plane Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Validate control plane
        run: python -m unittest tests.test_control_plane -v
      - name: Emit control-plane audit
        run: python tools/audit_control_plane.py --format markdown --fail-on error
