name: Discord runtime candidate
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: runtime/discord-template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check tracked credential hygiene before dependencies
        working-directory: .
        run: python -S -B tools/check_tracked_secret_hygiene.py
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install audio encoder (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install audio encoder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The community feed can answer 406, and choco then reports "installed 0/0
          # packages" with exit code 0. Retry, and stop here if ffmpeg is still missing
          # instead of failing later in the audio tests.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --yes --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (20 * $attempt) }
          }
          $version = @(ffmpeg -version)
          $version[0]
      - name: Prepare isolated Linux verification fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Pinned by digest: the fixture image is reviewed input, not a moving tag.
          fixture='node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6'
          docker pull "$fixture"
          image="$(docker image inspect --format '{{.Id}}' "$fixture")"
          printf 'KOTODAMA_TEST_VERIFIER_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - run: pnpm test
      - run: pnpm check
