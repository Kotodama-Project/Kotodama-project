name: Cloudflare edge preview candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit SHA bound by the deployment Work Order
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-edge-preview
  cancel-in-progress: false

jobs:
  validate-candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse malformed candidate input
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out trusted validator from the dispatch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out the exact candidate without executing its code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse candidate that is not the allowed branch tip
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin \
            +refs/heads/codex/cloudflare-os-foundation-rebased-20260824:refs/remotes/origin/codex/cloudflare-os-foundation-rebased-20260824
          test "$(git rev-parse refs/remotes/origin/codex/cloudflare-os-foundation-rebased-20260824)" = "$CANDIDATE_SHA"

      - name: Validate candidate bytes with trusted code
        run: |
          python trusted/tools/validate_cloudflare_edge_candidate.py --root candidate

  upload-preview-version:
    needs: validate-candidate
    if: github.ref == 'refs/heads/main'
    environment: cloudflare-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted upload tooling from the dispatch revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Refuse candidate mismatch
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          cd candidate
          test "$CANDIDATE_SHA" != ""
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin \
            +refs/heads/codex/cloudflare-os-foundation-rebased-20260824:refs/remotes/origin/codex/cloudflare-os-foundation-rebased-20260824
          test "$(git rev-parse refs/remotes/origin/codex/cloudflare-os-foundation-rebased-20260824)" = "$CANDIDATE_SHA"

      - name: Set up exact Node runtime for verified Wrangler
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          check-latest: false

      - name: Download, verify, and install exact Wrangler artifact without secrets
        shell: bash
        run: |
          set -euo pipefail
          wrangler_tarball="$RUNNER_TEMP/wrangler-4.120.0.tgz"
          wrangler_prefix="$RUNNER_TEMP/wrangler-verified"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$wrangler_tarball" \
            'https://registry.npmjs.org/wrangler/-/wrangler-4.120.0.tgz'
          python trusted/tools/verify_wrangler_artifact.py \
            --metadata trusted/runtime/cloudflare-edge/wrangler-integrity.json \
            --artifact "$wrangler_tarball"
          mkdir -p "$wrangler_prefix"
          cp trusted/runtime/cloudflare-edge/wrangler-runner-package.json "$RUNNER_TEMP/wrangler-verified/package.json"
          cp trusted/runtime/cloudflare-edge/wrangler-runner-package-lock.json "$RUNNER_TEMP/wrangler-verified/package-lock.json"
          cp "$wrangler_tarball" "$RUNNER_TEMP/wrangler-verified/wrangler-4.120.0.tgz"
          cd "$RUNNER_TEMP"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/wrangler-verified"
          test "$(node "$wrangler_prefix/node_modules/wrangler/bin/wrangler.js" --version)" = "4.120.0"

      - name: Upload preview version without production promotion
        shell: bash
        working-directory: candidate/runtime/cloudflare-edge
        env:
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ACCESS_ISSUER: ${{ secrets.ACCESS_ISSUER }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTEXT_GATEWAY_CLIENT_ID: ${{ secrets.CONTEXT_GATEWAY_CLIENT_ID }}
          CONTEXT_GATEWAY_CLIENT_SECRET: ${{ secrets.CONTEXT_GATEWAY_CLIENT_SECRET }}
          CONTEXT_GATEWAY_ORIGIN: ${{ secrets.CONTEXT_GATEWAY_ORIGIN }}
          PREVIEW_HOST: ${{ secrets.PREVIEW_HOST }}
        run: |
          set -euo pipefail
          preview_secrets_file="$RUNNER_TEMP/kotodama-preview-secrets.json"
          export KOTODAMA_PREVIEW_SECRETS_FILE="$preview_secrets_file"
          trap 'rm -f "$KOTODAMA_PREVIEW_SECRETS_FILE"' EXIT
          umask 077
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = (
              "ACCESS_AUD",
              "ACCESS_ISSUER",
              "CONTEXT_GATEWAY_CLIENT_ID",
              "CONTEXT_GATEWAY_CLIENT_SECRET",
              "CONTEXT_GATEWAY_ORIGIN",
              "PREVIEW_HOST",
          )
          values = {name: os.environ.get(name, "") for name in required}
          missing = [name for name, value in values.items() if not value.strip()]
          if missing:
              raise SystemExit(
                  "missing required preview runtime bindings: " + ", ".join(missing)
              )
          with Path(os.environ["KOTODAMA_PREVIEW_SECRETS_FILE"]).open(
              "x", encoding="utf-8"
          ) as handle:
              json.dump(values, handle, separators=(",", ":"))
          PY
          candidate_config="$GITHUB_WORKSPACE/candidate/runtime/cloudflare-edge/wrangler.jsonc"
          test -f "$candidate_config"
          test ! -L "$candidate_config"
          node "$RUNNER_TEMP/wrangler-verified/node_modules/wrangler/bin/wrangler.js" \
            --config "$candidate_config" \
            versions upload --env preview --preview-alias voice-review \
            --secrets-file "$KOTODAMA_PREVIEW_SECRETS_FILE" \
            --message "candidate ${{ inputs.candidate_sha }}"
